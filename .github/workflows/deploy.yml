name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  
jobs:
  build:
    env:
      GH_TOKEN: ${{ github.token }}

    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 'Get latest version'
      id: version
      run: echo "id=$(curl -s https://raw.githubusercontent.com/misode/mcmeta/summary/version.txt)" >> $GITHUB_OUTPUT

    - name: Build
      run: |
        npm install
        export latest_version="'${{ steps.version.outputs.id }}'"

        url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
        export sub_directory=$(python -c "from urllib.parse import urlparse; print(urlparse('$url').path.rstrip('/'))")
        if [ -n "$sub_directory" ]; then
          echo "Deploying to $sub_directory"
        fi

        npm run build

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
